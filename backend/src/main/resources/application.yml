server:
  port: 8080

spring:
  application:
    name: collab-editor

  # --- Postgres: users, workspaces, roles ---
  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/collab_editor
    username: collab
    password: collab

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # --- MongoDB: document snapshots + session history ---
  data:
    mongodb:
      uri: mongodb://127.0.0.1:27017/collab_editor
    redis:
      host: 127.0.0.1
      port: 6379



# used to build the shareable join link returned to the frontend
app:
  frontend-base-url: http://localhost:5173

# workspace lifetime, in hours (matches the "expire after 3 hours" requirement)
workspace:
  expiry-hours: 3
  # how often the expiry job checks for expired workspaces, in ms
  expiry-check-interval-ms: 60000
  # how often buffered Yjs updates are flushed to MongoDB, in ms
  persistence-flush-interval-ms: 5000