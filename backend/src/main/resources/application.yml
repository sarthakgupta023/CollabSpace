server:
  port: ${PORT:8080}

spring:
  application:
    name: collab-editor

  # --- Postgres: users, workspaces, roles ---
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5433/collab_editor}
    username: ${SPRING_DATASOURCE_USERNAME:collab}
    password: ${SPRING_DATASOURCE_PASSWORD:collab}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # --- MongoDB & Redis ---
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://127.0.0.1:27017/collab_editor}
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}

# used to build the shareable join link returned to the frontend
app:
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:5173}

# workspace lifetime, in hours
workspace:
  expiry-hours: 3
  expiry-check-interval-ms: 60000
  persistence-flush-interval-ms: 5000